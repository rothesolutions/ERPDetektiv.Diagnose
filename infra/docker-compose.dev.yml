services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: erpdetektiv-sql-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting the development database.}
    ports:
      - "127.0.0.1:1533:1433"
    volumes:
      - erpdetektiv_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  erpdetektiv_sql_data:
    name: erpdetektiv_sql_data
